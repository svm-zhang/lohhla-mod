[project]
site_name = "lohhlamod"
site_description = "Detecting HLA LOH events in tumor"
site_author = "Simo V. Zhang"
site_url = "https://svm-zhang.github.io/lohhlamod/"
repo_name = "svm-zhang/lohhlamod"
repo_url = "https://github.com/svm-zhang/lohhlamod"
edit_uri = "edit/main/docs"
copyright = """
Copyright &copy; 2026 lohhlamod author
"""
extra_css = ["stylesheets/extra.css"]

# Section for navigation configuration
nav = [
  {"Home" = "index.md"},
  {"Getting Started" = "get_start.md"},
  {"Explain Output" = "output.md"},
  {"Visualization" = "visual.md"},
  {"Algorithm" = "algorithm.md"},
  {"Dataset" = "dataset.md"}
]

# Section for theme configuration
[project.theme]
font = false
language = "en"

features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "header.autohide",
  "navigation.expand",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
  "toc.integrate"
]


[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"
edit = "lucide/pencil"
view = "lucide/view"


